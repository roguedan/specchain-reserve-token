coverage:
  status:
    project:
      default:
        target: 95%
        threshold: 1%
    patch:
      default:
        target: 95%
        threshold: 1%

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false

ignore:
  - "tests/"
  - "script/"
  - "lib/"
  - "node_modules/"
  - ".github/"

flags:
  foundry:
    paths:
      - contracts/

github_checks:
  annotations: true