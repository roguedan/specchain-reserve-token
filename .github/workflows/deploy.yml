name: Deploy and Verify

on:
  workflow_dispatch:
    inputs:
      network:
        description: 'Network to deploy to'
        required: true
        default: 'sepolia'
        type: choice
        options:
        - sepolia
        - mainnet
      verify:
        description: 'Verify contract on Etherscan'
        required: true
        default: true
        type: boolean

env:
  FOUNDRY_PROFILE: default

jobs:
  deploy:
    name: Deploy Contract
    runs-on: ubuntu-latest
    environment: deployment
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install dependencies
        run: forge install

      - name: Run tests before deployment
        run: |
          forge test --match-path '*' --no-match-path 'tests/ReserveRequirement.invariant.t.sol'

      - name: Deploy to Sepolia
        if: ${{ inputs.network == 'sepolia' }}
        run: |
          forge script script/Deploy.s.sol:Deploy \
            --rpc-url ${{ secrets.SEPOLIA_RPC_URL }} \
            --private-key ${{ secrets.PRIVATE_KEY }} \
            --broadcast \
            --verify \
            --etherscan-api-key ${{ secrets.ETHERSCAN_API_KEY }} \
            -vvvv
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}

      - name: Deploy to Mainnet
        if: ${{ inputs.network == 'mainnet' }}
        run: |
          forge script script/Deploy.s.sol:Deploy \
            --rpc-url ${{ secrets.MAINNET_RPC_URL }} \
            --private-key ${{ secrets.PRIVATE_KEY }} \
            --broadcast \
            --verify \
            --etherscan-api-key ${{ secrets.ETHERSCAN_API_KEY }} \
            -vvvv
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}

      - name: Post-deployment verification
        run: |
          echo "Deployment completed successfully"
          echo "Network: ${{ inputs.network }}"
          echo "Verification: ${{ inputs.verify }}"
          
          # Extract deployed address from logs (this would need to be customized based on your deploy script)
          echo "Check the deployment logs above for the contract address"

      - name: Update README with new deployment
        if: success()
        run: |
          echo "⚠️ Manual step required: Update README.md with new deployment address and transaction hash"