name: Security

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run security checks daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  slither:
    name: Slither Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install dependencies
        run: forge install

      - name: Manual Slither analysis
        run: |
          # Install Slither via pip for more reliable installation
          pip install slither-analyzer
          
          # Run Slither with basic configuration
          slither . --filter-paths "lib/" --exclude-dependencies || echo "Slither completed with warnings"
        continue-on-error: true

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --debug --only-verified

  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Check for known vulnerabilities
        run: |
          # Check OpenZeppelin version
          forge tree | grep -i openzeppelin || echo "No OpenZeppelin found"
          
          # List all dependencies
          echo "=== Dependency Tree ==="
          forge tree
          
          # Check for outdated dependencies
          echo "=== Checking for updates ==="
          forge update --dry-run || echo "No updates available"